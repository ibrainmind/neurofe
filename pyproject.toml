[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofe"
dynamic = ["version"]
description = "Fit neural mass models to empirical TMS-EEG data with gradient-based optimization."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "neurofe contributors"},
]
keywords = ["neuroscience", "EEG", "TMS", "neural-mass-model", "brain-simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.21",
    "torch>=2.0",
    "scipy>=1.7",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
sim = ["pandas>=1.3"]
viz = ["mne>=1.0", "nibabel>=3.0", "pysurfer>=0.11", "mayavi>=4.7", "Pillow>=8.0", "matplotlib>=3.4"]
examples = ["matplotlib>=3.4", "pandas>=1.3"]
dev = ["pytest>=7.0", "matplotlib>=3.4", "pandas>=1.3"]

[project.urls]
Homepage = "https://github.com/neurofe/neurofe"
Documentation = "https://github.com/neurofe/neurofe"
Repository = "https://github.com/neurofe/neurofe"

[tool.setuptools.dynamic]
version = {attr = "neurofe.__version__"}

[tool.setuptools.packages.find]
include = ["neurofe*"]
